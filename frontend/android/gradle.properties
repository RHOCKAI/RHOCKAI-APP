org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
android.newDsl=false
kotlin.daemon.jvm.options=-Xmx1G
# Network stability: force TLS 1.2, increase timeout
systemProp.https.protocols=TLSv1.2
systemProp.http.socketTimeout=120000
systemProp.http.connectionTimeout=120000
org.gradle.daemon=false
