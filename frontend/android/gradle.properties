org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError -Djava.net.preferIPv4Stack=true
android.useAndroidX=true
android.enableJetifier=true
android.newDsl=false
kotlin.daemon.jvm.options=-Xmx1G
# Network stability: force IPv4 stack, TLS 1.2/1.3, reasonable timeouts
systemProp.java.net.preferIPv4Stack=true
systemProp.java.net.preferIPv4Addresses=true
systemProp.https.protocols=TLSv1.2,TLSv1.3
systemProp.http.socketTimeout=30000
systemProp.http.connectionTimeout=30000
org.gradle.daemon=false
